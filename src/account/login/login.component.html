<div [@routerTransition] class="login-container">
  <div class="login-wrapper">
    <!-- Left Side - Branding -->
    <div class="login-brand">
      <!-- <div class="brand-logo">
        <img src="assets/img/logo.png" alt="Logo" />
      </div> -->
      <h1 class="brand-title">Usama Sweets & Bakers</h1>
      <p class="brand-subtitle">
        Best Sweets and Bakers in the town
      </p>
      
      <div class="brand-features">
        <div class="brand-feature">
          <i class="fas fa-check"></i>
          <span>Fresh from our oven to your heart.</span>
        </div>  
        <div class="brand-feature">
          <i class="fas fa-check"></i>
          <span>Stay sweet. Eat fresh.</span>
        </div>
        <div class="brand-feature">
          <i class="fas fa-check"></i>
          <span>A touch of elegance in every bite.</span>
        </div>
      </div>
    </div>

    <!-- Right Side - Login Form -->
    <div class="login-form-section">
      <!-- <div class="login-header">
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-description">Sign in to your account to continue</p>
      </div> -->

      <form novalidate autocomplete="off" #loginForm="ngForm" (ngSubmit)="login()">
        <!-- Tenant Selection -->
        <div class="tenant-info-box" *ngIf="isMultiTenancyEnabled">
          <div class="tenant-info-content">
            <span class="tenant-label">{{ "CurrentTenant" | localize }}</span>
            <span class="tenant-value" *ngIf="tenancyName; else noTenant">
              {{ tenancyName }}
            </span>
            <ng-template #noTenant>
              <span class="tenant-value" style="color: #9ca3af;">{{ "NotSelected" | localize }}</span>
            </ng-template>
          </div>
          <button type="button" class="tenant-change-btn" (click)="showChangeModal()">
            {{ "Change" | localize }}
          </button>
        </div>

        <!-- Username/Email Field -->
        <div class="form-group">
          <label class="form-label">{{ "UserNameOrEmail" | localize }}</label>
          <div class="input-wrapper">
            <input
              type="text"
              class="form-input"
              [ngClass]="{ 'invalid': userNameOrEmailAddressModel.invalid && userNameOrEmailAddressModel.touched }"
              name="userNameOrEmailAddress"
              [(ngModel)]="authService.authenticateModel.userNameOrEmailAddress"
              [placeholder]="'Enter your username or email'"
              required
              maxlength="256"
              #userNameOrEmailAddressModel="ngModel"
              #userNameOrEmailAddressEl
            />
            <span class="input-icon user-icon">
              <i class="fas fa-user"></i>
            </span>
          </div>
          <abp-validation-summary
            [control]="userNameOrEmailAddressModel"
            [controlEl]="userNameOrEmailAddressEl"
          ></abp-validation-summary>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label">{{ "Password" | localize }}</label>
          <div class="input-wrapper">
            <input
              [type]="passwordVisible ? 'text' : 'password'"
              class="form-input"
              [ngClass]="{ 'invalid': passwordModel.invalid && passwordModel.touched }"
              name="password"
              [(ngModel)]="authService.authenticateModel.password"
              [placeholder]="'Enter your password'"
              required
              maxlength="32"
              #passwordModel="ngModel"
              #passwordEl
            />
            <span
              class="input-icon"
              (click)="passwordVisible = !passwordVisible"
            >
              <i
                class="fas"
                [ngClass]="passwordVisible ? 'fa-eye-slash' : 'fa-eye'"
              ></i>
            </span>
          </div>
          <abp-validation-summary
            [control]="passwordModel"
            [controlEl]="passwordEl"
          ></abp-validation-summary>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="remember-me">
            <input
              type="checkbox"
              id="rememberMe"
              name="rememberMe"
              [(ngModel)]="authService.rememberMe"
            />
            <span>{{ "RememberMe" | localize }}</span>
          </label>
          <!-- <a href="#" class="forgot-password">Forgot Password?</a> -->
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="btn-login"
          [ngClass]="{ 'loading': submitting }"
          [disabled]="!loginForm.form.valid || submitting"
        >
          <span *ngIf="!submitting">{{ "Login" | localize }}</span>
        </button>
      </form>
    </div>
  </div>
</div>
