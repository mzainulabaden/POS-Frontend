<div class="">
  <div class="p-2 mb-2">
    <!-- Category Filter Dropdown -->
    <select 
      class="form-select form-select-sm" 
      [(ngModel)]="selectedCategoryId"
      (ngModelChange)="onCategoryChange()"
    >
      <option [ngValue]="null">All Categories</option>
      <option *ngFor="let category of categories" [ngValue]="category.id">
        {{ category.name }}
      </option>
    </select>
  </div>
  <div class="vh-100 overflow-y-auto p-2" style="height: calc(100vh - 80px);">
    <!-- Product Cards - Stacked vertically for narrow space -->
    <div class="d-flex flex-column gap-2">
      <div
        *ngFor="let product of filteredProducts; let i = index; trackBy: trackByProductId"
        class="card border rounded"
        [class.selected-product]="isProductSelected(i)"
        [class.keyboard-focus]="isProductSelected(i)"
        [attr.data-product-index]="i"
        (click)="addToCart(product)"
        style="cursor: pointer"
      >
        <div class="card-body text-center p-2">
          <div class="text-muted small mb-1" style="font-size: 0.7rem;">
            <span *ngIf="product.barcode || product.Barcode">{{ product.barcode || product.Barcode }}</span>
            <span *ngIf="(product.stockQty ?? product.currentStock ?? product.availableQty) !== undefined" style="margin-left: 6px;">
              Stock: {{ (product.stockQty ?? product.currentStock ?? product.availableQty) || 0 }}
            </span>
          </div>
          <h6 class="card-title mb-1 small text-truncate" [title]="product.name">{{ product.name }}</h6>
          <p class="fw-bold text-primary mb-0 small">
            {{ product.unitPrice }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
