<div class="">
  <div class="vh-100 overflow-y-auto p-2">
    <!-- Product Cards - Stacked vertically for narrow space -->
    <div class="d-flex flex-column gap-2">
      <div
        *ngFor="let product of filteredProducts; trackBy: trackByProductId"
        class="card border rounded"
        (click)="addToCart(product)"
        style="cursor: pointer"
      >
        <div class="card-body text-center p-2">
          <div *ngIf="product.barcode || product.Barcode || product.sku || product.SKU" class="text-muted small mb-1" style="font-size: 0.7rem;">
            {{ product.barcode || product.Barcode || product.sku || product.SKU }}
          </div>
          <h6 class="card-title mb-1 small text-truncate" [title]="product.name">{{ product.name }}</h6>
          <p class="fw-bold text-primary mb-0 small">
            {{ product.unitPrice }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
