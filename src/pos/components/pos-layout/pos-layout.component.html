<!-- POS Layout -->
<div class="container-fluid vh-100 overflow-hidden">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <!-- Navigation State Indicator -->
    <div class="nav-state-indicator" [class]="'state-' + navigationState.currentSection">
      <span class="state-text">{{ navigationState.currentSection | titlecase }}</span>
      <span class="state-key" *ngIf="navigationState.currentSection === 'search'">(F3/F4)</span>
      <span class="state-key" *ngIf="navigationState.currentSection === 'products'">(F5)</span>
      <span class="state-key" *ngIf="navigationState.currentSection === 'cart'">(F6)</span>
      <span class="state-key" *ngIf="navigationState.currentSection === 'actions'">(F7)</span>
    </div>
    
    <div
      class="container-fluid d-flex justify-content-between align-items-center px-3"
    >
      <!-- Sidebar Toggle Button -->
      <button (click)="toggleSidebar()" class="btn btn-outline-success">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div style="width: 40%" class="d-flex gap-2 position-relative">
        <!-- Search Input with Dropdown -->
        <div class="position-relative w-100">
          <input
            type="text"
            pInputText
            placeholder="Search by Name or SKU..."
            [(ngModel)]="searchItems"
            (input)="onSearchChange()"
            (keydown)="onSearchKeyDown($event)"
            (blur)="onSearchBlur()"
            (focus)="onSearchFocus()"
            #searchInput
            class="w-100"
            autocomplete="off"
          />
          
          <!-- Search Dropdown -->
          <div 
            *ngIf="showSearchDropdown && searchResults.length > 0" 
            class="search-dropdown"
            style="position: absolute; top: 100%; left: 0; right: 0; z-index: 1000; background: white; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 300px; overflow-y: auto;"
          >
            <div 
              *ngFor="let product of searchResults; let i = index; trackBy: trackByProduct"
              class="search-result-item"
              [class.selected]="i === selectedSearchIndex"
              (click)="selectSearchResult(product, i)"
              (mouseenter)="selectedSearchIndex = i"
              style="padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 12px;"
              [style.background-color]="i === selectedSearchIndex ? '#f5f5f5' : 'white'"
            >
              <div class="flex-grow-1">
                <div class="fw-bold text-dark" style="font-size: 14px; margin-bottom: 2px;">
                  {{ product.name }}
                </div>
                <div class="text-muted small" style="font-size: 12px;">
                  <span *ngIf="product.sku || product.SKU">SKU: {{ product.sku || product.SKU }}</span>
                  <span *ngIf="product.barcode || product.Barcode" style="margin-left: 8px;">
                    Barcode: {{ product.barcode || product.Barcode }}
                  </span>
                </div>
              </div>
              <div class="text-success fw-bold" style="font-size: 14px;">
                ${{ product.unitPrice || product.price || '0.00' }}
              </div>
            </div>
          </div>
        </div>
        
        <ng-container *ngIf="showBarcodeInput">
          <input
            type="text"
            pInputText
            placeholder="Scan barcode"
            [(ngModel)]="barcodeInput"
            #barcodeScan
            autocomplete="off"
            style="width: 260px"
          />
        </ng-container>
      </div>

      <!-- Right Side Menu -->
      <div class="d-flex align-items-center gap-3">
        <!-- Keyboard Help Button -->
        <button (click)="showKeyboardHelp()" class="btn btn-outline-info" title="Keyboard Shortcuts (F1)">
          <i class="fa-solid fa-keyboard me-1"></i>
          Help
        </button>

        <!-- Hold Orders Button -->
        <button (click)="showHoldOrders()" class="btn btn-outline-primary">
          <i class="fa-solid fa-clock-rotate-left me-1"></i>
          Hold Orders
        </button>

        <!-- Full Screen Button -->
        <button (click)="toggleFullScreen()" class="btn btn-link text-success">
          <i *ngIf="!isFullScreen" class="fa-solid fa-maximize"></i>
          <i *ngIf="isFullScreen" class="fa-solid fa-minimize"></i>
        </button>

        <button
          class="btn btn-link text-success"
          (click)="goto('app/main/dashboard/dashboard')"
        >
          <i class="fa fa-sign-out"></i>
        </button>
      </div>
    </div>
  </nav>
  <div class="d-flex" style="height: 100%">
    <!-- Cart Sidebar (Left - 80%) -->
    <div style="width: 80%">
      <app-pos-cart-sidebar
        class="d-block w-100"
        style="height: 90vh"
      ></app-pos-cart-sidebar>
    </div>

    <!-- Product Grid (Right - 20%) -->
    <div style="width: 20%">
      <app-pos-items #posItems class="d-block w-100"></app-pos-items>
    </div>
  </div>
</div>
